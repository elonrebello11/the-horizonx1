<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

// Your Firebase Project Credentials
const firebaseConfig = {
  apiKey: "AIzaSyD-BrAjz0d_M3a-H-NAWnqTANbw1h1fuN0",
  authDomain: "esp-32-aws.firebaseapp.com",
  databaseURL: "https://esp-32-aws-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "esp-32-aws",
  storageBucket: "esp-32-aws.firebasestorage.app",
  messagingSenderId: "937467091314",
  appId: "1:937467091314:web:52cabb7b0ad155f150e5eb"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const weatherRef = ref(database, "weatherStation");

const $ = id => document.getElementById(id);

// Drawer Navigation
const drawer = $("drawer");
const overlay = $("drawerOverlay");
const openDrawer = () => { drawer.classList.add("open"); overlay.classList.add("open"); };
const closeDrawer = () => { drawer.classList.remove("open"); overlay.classList.remove("open"); };
$("menuButton").addEventListener("click", openDrawer);
$("closeDrawer").addEventListener("click", closeDrawer);
overlay.addEventListener("click", closeDrawer);

document.querySelectorAll("[data-scroll]").forEach(btn => {
  btn.addEventListener("click", () => {
    closeDrawer();
    $(btn.dataset.scroll).scrollIntoView({behavior:"smooth"});
  });
});

// Dev Panel Toggle
const devPanel = $("devPanel");
const devToggle = $("devToggle");
devToggle.addEventListener("click", () => {
  devPanel.classList.toggle("collapsed");
  devToggle.textContent = devPanel.classList.contains("collapsed") ? "Show" : "Hide";
});

// Listen to Live Firebase Database Updates
onValue(weatherRef, snapshot => {
  const data = snapshot.val();

  if (!data) {
    $("firebaseStatusText").textContent = "Waiting for Firebase data...";
    $("firebaseStatus").classList.remove("ok");
    $("heroSensor").textContent = "Waiting";
    $("deviceStatus").textContent = "No sensor data found at /weatherStation path.";
    $("devicePill").textContent = "WAITING";
    return;
  }

  if (typeof data.temperature === "number") {
    $("temperature").innerHTML = `${data.temperature.toFixed(1)} <span class="unit">°C</span>`;
  }
  if (typeof data.humidity === "number") {
    $("humidity").innerHTML = `${data.humidity.toFixed(0)} <span class="unit">%</span>`;
  }

  $("firebaseStatusText").textContent = "Firebase connected";
  $("firebaseStatus").classList.add("ok");
  $("heroSensor").textContent = "Online";
  $("devicePill").textContent = "ONLINE";
  $("deviceStatus").textContent = "Live sensor data synchronized via Firebase Realtime Database.";
  $("sensorUpdated").textContent = new Date().toLocaleTimeString();
}, error => {
  $("firebaseStatusText").textContent = "Firebase connection error";
  $("firebaseStatus").classList.add("bad");
  $("devicePill").textContent = "ERROR";
  $("deviceStatus").textContent = error.message;
});

// Open-Meteo Weather Integration
const conditionNames = {
  0:"Clear sky ☀️",1:"Mainly clear 🌤️",2:"Partly cloudy ⛅",3:"Overcast ☁️",
  45:"Fog 🌫️",48:"Depositing rime fog 🌫️",51:"Light drizzle 🌦️",
  53:"Moderate drizzle 🌦️",55:"Dense drizzle 🌧️",61:"Slight rain 🌧️",
  63:"Moderate rain 🌧️",65:"Heavy rain 🌧️",71:"Slight snowfall ❄️",
  73:"Moderate snowfall ❄️",75:"Heavy snowfall ❄️",80:"Rain showers 🌧️",
  81:"Moderate rain showers 🌧️",82:"Violent rain showers 🌧️",
  95:"Thunderstorm ⛈️",96:"Thunderstorm with hail ⛈️",99:"Thunderstorm with heavy hail ⛈️"
};

function getDirection(degrees){
  const directions=["N","NE","E","SE","S","SW","W","NW"];
  return directions[Math.round(degrees/45)%8];
}

let savedLatitude=null, savedLongitude=null, savedLocation="Your location";

async function loadWeather(latitude, longitude, locationName){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl&timezone=auto`;
  try{
    const response=await fetch(url);
    if(!response.ok) throw new Error("Weather service unavailable");
    const result=await response.json();
    const current=result.current;

    $("wind").innerHTML=`${Number(current.wind_speed_10m).toFixed(1)} <span class="unit">km/h</span>`;
    $("pressure").innerHTML=`${Number(current.pressure_msl).toFixed(0)} <span class="unit">hPa</span>`;
    $("condition").textContent=conditionNames[current.weather_code] ?? "Weather condition unavailable";
    $("windDirection").textContent=getDirection(current.wind_direction_10m);
    $("weatherUpdated").textContent=new Date().toLocaleTimeString();
    $("location").textContent="📍 "+locationName;
  }catch(error){
    $("condition").textContent="Unable to load online weather.";
  }
}

function detectLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async position=>{
    savedLatitude=position.coords.latitude;
    savedLongitude=position.coords.longitude;
    savedLocation="Your current location";
    await loadWeather(savedLatitude,savedLongitude,savedLocation);
  },()=>{
    $("location").textContent="📍 Location unavailable.";
  },{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
}

$("refreshButton").addEventListener("click",()=>{
  if(savedLatitude!==null) loadWeather(savedLatitude,savedLongitude,savedLocation);
  else detectLocation();
});

// Audio & Controls
const bassPulseAudio=$("bassPulseAudio");
const autoMusicToggle=$("autoMusicToggle");
const musicState=$("musicState");
const volumeControl=$("volume");

bassPulseAudio.volume=Number(volumeControl.value);

function updateMusicState(){
  musicState.textContent=autoMusicToggle.checked ? "AUTO ON" : "AUTO OFF";
}

async function startBassPulse(){
  if(!autoMusicToggle.checked) return;
  try{ await bassPulseAudio.play(); }catch(e){}
  updateMusicState();
}

$("heroMusicButton").addEventListener("click", async()=>{
  autoMusicToggle.checked=true;
  try{ await bassPulseAudio.play(); $("heroMusicButton").textContent="♫ Music playing"; }catch(e){}
  updateMusicState();
});

autoMusicToggle.addEventListener("change",()=>{
  if(autoMusicToggle.checked) startBassPulse();
  else { bassPulseAudio.pause(); updateMusicState(); }
});

volumeControl.addEventListener("input",()=>{
  bassPulseAudio.volume=Number(volumeControl.value);
});

window.addEventListener("load",()=>{
  detectLocation();
  updateMusicState();
  setTimeout(()=>$("splash").classList.add("hide"),1800);
});
</script>
