<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Horizon - Daily Story Engine</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --error-color: #f87171;
            --success-color: #4ade80;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        h1, h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: 2px solid var(--accent-color);
        }

        button {
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .message {
            margin-top: 10px;
            font-size: 14px;
        }

        .error { color: var(--error-color); }
        .success { color: var(--success-color); }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .word-tag {
            background-color: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .story-box {
            line-height: 1.6;
            font-size: 16px;
            white-space: pre-wrap;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Section 1: Submit a Word -->
    <div class="card">
        <h1>Submit Today's Word</h1>
        <p>Type a single word to contribute to today's community story.</p>
        <div class="input-group">
            <input type="text" id="wordInput" placeholder="e.g., Quantum" maxlength="20">
            <button id="submitBtn" onclick="submitWord()">Submit</button>
        </div>
        <div id="statusMessage" class="message"></div>
    </div>

    <!-- Section 2: Collected Words Pool -->
    <div class="card">
        <h2>Today's Word Pool (<span id="wordCount">0</span>)</h2>
        <div class="word-bank" id="wordBank">
            <!-- Words will appear here -->
        </div>
        <div class="controls">
            <button onclick="generateStory()">Simulate Daily Story Synthesis</button>
            <button style="background-color: #f87171;" onclick="clearPool()">Reset Pool</button>
        </div>
    </div>

    <!-- Section 3: Generated Daily Story -->
    <div class="card">
        <h2>Daily Story Output</h2>
        <div class="story-box" id="storyOutput">Submit words and trigger synthesis to read today's story...</div>
    </div>
</div>

<script>
    // Paste your exact firebaseConfig block from Firebase Web App Settings here:
    const firebaseConfig = {
        apiKey: "1:1018344856190:web:413a5e93c995734334162f",
        authDomain: "project-horizon-fb3a0.firebaseapp.com",
        databaseURL: "https://project-horizon-fb3a0-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "project-horizon-fb3a0",
        storageBucket: "project-horizon-fb3a0.appspot.com",
        messagingSenderId: "PASTE_SENDER_ID_HERE",
        appId: "PASTE_APP_ID_HERE"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const wordsRef = db.ref("words");

    const profanityFilter = ["badword1", "badword2", "swear1", "swear2", "crap", "damn"];
    let wordPool = [];

    // Gemini API Key
    const GEMINI_API_KEY = "AQ.Ab8RN6Kx8ce0EnB4T96nig7gWpljl3xinL33a6hUWm0FC263dQ"; 

    // Listen for real-time cloud database changes
    wordsRef.on("value", (snapshot) => {
        const data = snapshot.val();
        wordPool = data ? Object.values(data) : [];
        updateUI();
    });

    function updateUI() {
        const wordBank = document.getElementById("wordBank");
        const wordCount = document.getElementById("wordCount");
        wordBank.innerHTML = "";
        
        wordPool.forEach(word => {
            const tag = document.createElement("span");
            tag.className = "word-tag";
            tag.textContent = word;
            wordBank.appendChild(tag);
        });

        wordCount.textContent = wordPool.length;
    }

    function submitWord() {
        const input = document.getElementById("wordInput");
        const message = document.getElementById("statusMessage");
        const rawWord = input.value.trim().toLowerCase();

        if (!rawWord) {
            message.textContent = "Please enter a word.";
            message.className = "message error";
            return;
        }

        if (rawWord.includes(" ") || rawWord.split(/\s+/).length > 1) {
            message.textContent = "Error: Only single words are allowed!";
            message.className = "message error";
            return;
        }

        if (profanityFilter.includes(rawWord)) {
            message.textContent = "Blocked: Word flagged by the safety filter.";
            message.className = "message error";
            input.value = "";
            return;
        }

        // Push new word directly to Firebase Realtime Database
        wordsRef.push(rawWord);
        
        message.textContent = `Success! "${rawWord}" added to today's pool.`;
        message.className = "message success";
        input.value = "";
    }

    async function generateStory() {
        const output = document.getElementById("storyOutput");

        if (wordPool.length === 0) {
            output.textContent = "The word pool is empty! Add a few words first.";
            return;
        }

        output.textContent = "Synthesizing story via AI engine...";

        const prompt = `Write a short story. CRITICAL RULE: You are ONLY allowed to use the following list of words: ${wordPool.join(", ")}. Do not introduce outside nouns, verbs, or adjectives. You may only rearrange these exact words and add basic punctuation (periods, commas) to form the story.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                output.textContent = data.candidates[0].content.parts[0].text;
            } else {
                output.textContent = "Failed to generate story. Check API key or console for details.";
            }
        } catch (error) {
            console.error("API Error:", error);
            output.textContent = "An error occurred while connecting to the AI API.";
        }
    }

    function clearPool() {
        // Remove all words from Firebase database
        wordsRef.remove();
        document.getElementById("statusMessage").textContent = "";
        document.getElementById("storyOutput").textContent = "Submit words and trigger synthesis to read today's story...";
    }
</script>   

</body>
</html>
